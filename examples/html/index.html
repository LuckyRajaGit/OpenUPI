<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenUPI HTML Integration Example</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    .card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .btn-pay { background: #0284c7; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
    .btn-pay:hover { background: #0369a1; }
    .price { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Specialty Roast Coffee (500g)</h2>
    <p>Single origin Arabica beans with caramel and chocolate undertones.</p>
    <div class="price">₹650.00</div>

    <!-- Declarative OpenUPI HTML Data Attribute Integration -->
    <button
      class="btn-pay"
      data-openupi-checkout
      data-openupi-amount="650.00"
      data-openupi-order-id="HTML-ORD-101"
      data-openupi-name="Arjun Varma"
      data-openupi-phone="+91 98200 12345"
      data-openupi-success-callback="onPaymentSuccess"
    >
      Pay ₹650 with UPI
    </button>
  </div>

  <!-- Load OpenUPI Universal JavaScript SDK from your self-hosted gateway -->
  <script src="http://localhost:3000/openupi.js"></script>

  <script>
    function onPaymentSuccess(detail) {
      alert("Payment Successful! Reference: " + detail.paymentId);
      window.location.href = "/success.html?ref=" + detail.paymentId;
    }
  </script>
</body>
</html>
